[package]
name = "game-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
game-engine = { path = "../game-engine", features = ["voxel"] }
bevy = { workspace = true, features = ["std", "multi_threaded", "bevy_log"] }
fixed = { workspace = true }
rand_pcg = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
bevy_replicon = { workspace = true, optional = true }
rstar = { workspace = true }
crossbeam-channel = { workspace = true }

[features]
default = []
# 网络适配（replicon）——单人构建不需要，默认关闭。
net = ["dep:bevy_replicon", "game-engine/net"]

[dev-dependencies]
serde_json = "1"
criterion = { workspace = true }

[[bench]]
name = "voxel_terrain"
harness = false
