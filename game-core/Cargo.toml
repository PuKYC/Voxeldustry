[package]
name = "game-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
game-engine = { path = "../game-engine", features = ["voxel"] }
bevy = { workspace = true, features = ["std", "multi_threaded", "bevy_log"] }
fixed = { workspace = true }
rand_pcg = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
bevy_replicon = { workspace = true, optional = true }
rstar = { workspace = true }
crossbeam-channel = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-game-activity"] }

[features]
# 默认启用体素物理碰撞（avian3d）；不需要物理的构建可用 --no-default-features。
default = ["physics"]
# 网络适配（replicon）——单人构建不需要，默认关闭。
net = ["dep:bevy_replicon", "game-engine/net"]
# 体素物理碰撞；透传 game-engine/physics（默认关）。
physics = ["game-engine/physics"]

[dev-dependencies]
serde_json = "1"
criterion = { workspace = true }

[[bench]]
name = "voxel_terrain"
harness = false
