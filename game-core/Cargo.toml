[package]
name = "game-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
game-engine = { path = "../game-engine", features = ["voxel"] }
bevy = { workspace = true, features = ["std", "multi_threaded", "bevy_log"] }
fixed = { workspace = true }
rand_pcg = { workspace = true }
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = "1"
bevy_replicon = { workspace = true, optional = true }
bevy_mod_scripting = { version = "=0.21.1", default-features = false, features = [
    "lua54",
    "core_functions",
    "bevy_ecs_bindings",
], optional = true }
rstar = { workspace = true }
crossbeam-channel = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-game-activity"] }

[features]
# 默认启用体素物理碰撞（avian3d）；不需要物理的构建可用 --no-default-features。
default = ["physics"]
# 网络适配（replicon）——单人构建不需要，默认关闭。
net = ["dep:bevy_replicon", "game-engine/net"]
# 体素物理碰撞；透传 game-engine/physics（默认关）。
physics = ["game-engine/physics"]
# BMS 脚本层（v0.21.1 / Bevy 0.19）：Lua 脚本作为 ECS 附件，默认关。
scripting = ["dep:bevy_mod_scripting", "bevy/bevy_asset"]

[dev-dependencies]
criterion = { workspace = true }
gungraun = { workspace = true }

[[bench]]
name = "voxel_terrain"
harness = false

# 同一批路径的指令数基准（gungraun + valgrind），CI 门禁用。
[[bench]]
name = "terrain_inst"
harness = false

[lints]
workspace = true