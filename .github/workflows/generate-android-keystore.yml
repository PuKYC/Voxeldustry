name: Generate Android release keystore

# 一次性使用：在 GitHub Actions 里生成 Android release keystore，
# 并（可选）自动写入仓库 Secrets。用完请删除本次 run 与 artifact。
on:
  workflow_dispatch:
    inputs:
      alias:
        description: "key alias（写入 ANDROID_KEYSTORE_ALIAS）"
        required: false
        default: "release"
      password:
        description: "keystore 密码；留空则自动生成随机强密码"
        required: false
        default: ""
      validity_days:
        description: "证书有效期（天）"
        required: false
        default: "10000"

permissions:
  contents: read

jobs:
  generate:
    name: Generate keystore
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Java (keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        id: gen
        env:
          ALIAS: ${{ inputs.alias }}
          PASSWORD_INPUT: ${{ inputs.password }}
          VALIDITY: ${{ inputs.validity_days }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${PASSWORD_INPUT:-}" ]; then
            PASSWORD="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | cut -c1-24)"
          else
            PASSWORD="$PASSWORD_INPUT"
          fi
          test -n "$PASSWORD"

          # 证书主体直接使用当前 GitHub 上下文信息。
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity "$VALIDITY" \
            -storetype PKCS12 \
            -dname "CN=$ACTOR, OU=$REPO, O=$OWNER, L=GitHub, ST=GitHub, C=US" \
            -storepass "$PASSWORD" -keypass "$PASSWORD"

          base64 -w 0 release.keystore > keystore.b64
          printf '%s' "$PASSWORD" > .password

          {
            echo "alias=$ALIAS"
            echo "password=$PASSWORD"
          } >> "$GITHUB_OUTPUT"

          keytool -list -keystore release.keystore -storepass "$PASSWORD"
          echo "✅ keystore 生成完成"

      - name: Publish (auto secrets, or print to summary)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          ALIAS: ${{ steps.gen.outputs.alias }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail

          # 1) 配置了 GH_PAT（有 secrets 写权限的细粒度 PAT）→ 自动写入 Secrets，不显示私钥。
          if [ -n "${GH_TOKEN:-}" ]; then
            REPO_ARG="$GITHUB_REPOSITORY"
            gh secret set ANDROID_KEYSTORE_ALIAS --repo "$REPO_ARG" --body "$ALIAS"
            gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$REPO_ARG" --body "$(cat .password)"
            gh secret set ANDROID_KEYSTORE_BASE64 --repo "$REPO_ARG" --body "$(cat keystore.b64)"
            {
              echo "## ✅ 已自动写入 3 个仓库 Secrets"
              echo ""
              echo "- ANDROID_KEYSTORE_ALIAS = $ALIAS"
              echo "- ANDROID_KEYSTORE_PASSWORD / ANDROID_KEYSTORE_BASE64 已写入，未在本页显示"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "OK: secrets set"
            exit 0
          fi

          # 2) 没有 GH_PAT 且仓库公开 → 拒绝输出私钥材料。
          if [ "$REPO_PRIVATE" != "true" ]; then
            echo "❌ 仓库是公开的且未配置 GH_PAT，拒绝在 job summary 输出私钥材料。"
            echo "请添加一个有 Secrets 写权限的细粒度 PAT 作为仓库 Secret: GH_PAT。"
            exit 1
          fi

          # 3) 私有仓库且无 GH_PAT → 打印到 job summary，供手动复制。
          {
            echo "## ⚠️ Android release keystore 已生成（请立即复制）"
            echo ""
            echo "> 本页含私钥材料。复制完三个值后，请删除本次 workflow run 与 artifact。"
            echo ""
            echo "### ANDROID_KEYSTORE_ALIAS"
            echo '```'
            echo "$ALIAS"
            echo '```'
            echo "### ANDROID_KEYSTORE_PASSWORD"
            echo '```'
            cat .password
            echo ''
            echo '```'
            echo "### ANDROID_KEYSTORE_BASE64"
            echo '```'
            cat keystore.b64
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "OK: 三个值已写入 job summary"

      - name: Upload keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: android-release-keystore
          path: |
            release.keystore
            keystore.b64
          retention-days: 1
