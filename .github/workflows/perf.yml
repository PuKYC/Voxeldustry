name: Perf

# 两个互补的性能门禁。
#
#   bench         墙钟时间。同一台 runner 上交替跑「基线代码」和「当前代码」，
#                 由 gate.py 按 thresholds.json 判定回归，抵消 runner 机型差异。
#   instructions  指令数。gungraun + Valgrind Callgrind，结果与机器无关，
#                 基线可跨 runner 复用，默认 Ir 涨幅 > 10% 失败。
#
# 本地复现：
#   bash .github/scripts/perf/ab.sh origin/main
#   cargo bench -p game-core --bench terrain_inst -- --baseline=ci

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "game-core/**"
      - "game-engine/**"
      - ".github/workflows/perf.yml"
      - ".github/scripts/perf/**"
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "game-core/**"
      - "game-engine/**"
      - ".github/workflows/perf.yml"
      - ".github/scripts/perf/**"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "对比基线 ref（留空则自动：PR 取 base.sha，push 取 HEAD^）"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.85"

jobs:
  bench:
    name: Criterion A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          rustflags: ""

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: perf
          cache-on-failure: false

      - name: Runner info
        run: |
          nproc
          grep -m1 "model name" /proc/cpuinfo || true

      - name: Resolve base ref
        id: base
        env:
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_BASE_REF:-}" ]; then
            echo "ref=${INPUT_BASE_REF}" >> "$GITHUB_OUTPUT"
          elif [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${PR_BASE_SHA:-}" ]; then
            echo "ref=${PR_BASE_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD^" >> "$GITHUB_OUTPUT"
          fi

      - name: Run A/B benchmark
        env:
          PERF_PROFILE: ci
          PERF_REPEAT: "2"
          BASE_REF: ${{ steps.base.outputs.ref }}
        run: bash .github/scripts/perf/ab.sh "$BASE_REF"

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.run_id }}
          path: |
            target/perf-out/report.md
            target/perf-out/report.json
            target/perf-out/base.log
            target/perf-out/head.log
            target/perf-out/results/
          if-no-files-found: warn
          retention-days: 30

      - name: Comment on PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f target/perf-out/report.md ]; then
            echo "::warning:: 没有 report.md，跳过评论"
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --body-file target/perf-out/report.md \
            --edit-last --create-if-none \
            || echo "::warning:: 写 PR 评论失败（gh 版本或权限），报告见 job summary / artifact"

  # ---------------------------------------------------------------------------
  # 指令数门禁（gungraun + Valgrind Callgrind）。
  #
  # 与墙钟 A/B 互补：指令数与机器负载/频率无关，同一份代码 + 同一工具链
  # 跑出来完全一致，所以基线可以跨 runner 直接复用，阈值能卡到 10%。
  #
  # 报告：--save-summary=pretty-json 让 gungraun 在每个 benchmark 的输出目录
  # 生成 summary.json（target/gungraun/$PACKAGE/$BENCH_FILE/$GROUP/$BENCH_ID/）。
  # 后续用 jq 聚合为 target/inst-out/report.md 和 report.json，上传 artifact，
  # 并像 bench job 一样写 PR 评论。v7 schema 的 Ir 在 .data.total.metrics.Ir，
  # 涨跌在 .change.diff_pct。
  # ---------------------------------------------------------------------------
  instructions:
    name: Gungraun (instruction counts)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GUNGRAUN_HOME: ${{ github.workspace }}/.gungraun

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          rustflags: ""

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: perf-ir

      # 官方 action 自动匹配 Cargo.toml 里的 gungraun 版本，同时装 valgrind
      # 和 libc debug symbols，比手动 cargo install 更稳。
      - name: Setup gungraun-runner and Valgrind
        uses: gungraun/setup-gungraun@v1
        with:
          runner-version: "0.20.0"
          valgrind-strategy: "auto"

      - name: Restore instruction baseline
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GUNGRAUN_HOME }}
          key: gungraun-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gungraun-${{ runner.os }}-

      - name: Run instruction benchmarks
        id: inst
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            flag="--save-baseline=ci"
          else
            flag="--baseline=ci"
          fi
          echo "gungraun 参数: ${flag}"
          cargo bench -p game-core --bench terrain_inst -- \
            "${flag}" --save-summary=pretty-json
          cargo bench -p game-engine --features voxel,physics --bench voxel_collider_inst -- \
            "${flag}" --save-summary=pretty-json

      # 聚合散落的 summary.json 为统一报告。
      - name: Build instruction report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p target/inst-out
          # 收集所有 summary.json，并打上相对路径作为来源标签。
          if compgen -G "target/gungraun/**/summary.json" > /dev/null 2>&1; then
            find target/gungraun -name summary.json -print0 \
              | xargs -0 jq -c '.' \
              > target/inst-out/report.json
          else
            echo "[]" > target/inst-out/report.json
          fi

          # 用 jq 生成 Markdown 表格。
          jq -r '
            def ir: (.data.total.metrics.Ir // .data.total.metrics.ir // null);
            def diff: (.change.diff_pct // null);
            ["## Instruction Counts (gungraun)", "",
             "| Benchmark | Ir | Diff |",
             "|---|---:|---:|"]
            + (if length == 0 then ["_无 summary.json 数据_"]
               else
                 map(
                   "| \(.benchmark_file | split("/") | last) / \(.group // "-") / \(.function // .id // "-") " +
                   "| \(if ir then (ir | tostring) else "n/a" end) " +
                   "| \(if diff then diff + "%" else "—" end) |"
                 )
               end)
            | join("\n")
          ' target/inst-out/report.json > target/inst-out/report.md

          cat target/inst-out/report.md

      - name: Upload instruction report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inst-${{ github.run_id }}
          path: |
            target/inst-out/report.md
            target/inst-out/report.json
          if-no-files-found: warn
          retention-days: 30

      # 同仓库 PR 才写评论；fork PR 只有只读 token。
      - name: Comment instruction report on PR
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f target/inst-out/report.md ]; then
            echo "::warning:: 没有 instructions report.md，跳过评论"
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --body-file target/inst-out/report.md \
            --edit-last --create-if-none \
            || echo "::warning:: 写 instructions PR 评论失败，报告见 artifact"

      - name: Save instruction baseline
        if: github.ref == 'refs/heads/main' && steps.inst.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.GUNGRAUN_HOME }}
          key: gungraun-${{ runner.os }}-${{ github.run_id }}