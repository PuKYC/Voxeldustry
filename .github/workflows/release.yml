name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（如 v0.1.0）。留空 = 只构建 artifact，不发布 Release。"
        required: false
        default: ""
      platforms:
        description: "只构建指定平台，逗号分隔；留空 = 全部。可选：linux-x86_64, linux-arm64, windows-x86_64, android-apk, android-aab"
        required: false
        default: ""
      publish:
        description: "是否创建 / 更新 GitHub Release（仅当 tag 非空时生效）"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95"
  # 必须与 godot-project/project.godot 的 config/features 一致。
  GODOT_VERSION: "4.7.2"
  # Godot 4.7 官方 Android 导出要求：NDK r28b / build-tools 35.0.1 / android-35。
  ANDROID_NDK_VERSION: "r28b"

# =============================================================================
# 扩展指南：在 prepare 步骤的 ALL 数组里追加一条即可
# （preset 名与 godot-project/export_presets.cfg 保持一致）。
#
# 手动触发（workflow_dispatch）用法：
#   - 只勾 platforms 里的某个 name → 只构建该平台（适合调试）。
#   - tag 留空 → 只上传 artifact，不发布 Release。
#   - tag 填 vX.Y.Z + publish=true → 构建并发布 / 更新 Release。
# =============================================================================

jobs:
  # ---------------------------------------------------------------------------
  # Prepare：把手动输入的 platforms 过滤成 matrix.include。
  # 之所以单独拆一个 job，是因为 job 级 if 里访问不到 matrix.*。
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail

          # 所有平台的完整定义（与 build matrix.include 一致）。
          ALL='[
            {
              "name":"linux-x86_64","runner":"ubuntu-22.04",
              "targets":"x86_64-unknown-linux-gnu","cargo_cmd":"cargo",
              "preset":"Linux x86_64","out":"build/linux/game.x86_64",
              "artifact":"game-linux-x86_64","experimental":false
            },
            {
              "name":"linux-arm64","runner":"ubuntu-24.04",
              "targets":"aarch64-unknown-linux-gnu","cargo_cmd":"cross",
              "preset":"Linux arm64","out":"build/linux/game.arm64",
              "artifact":"game-linux-arm64","experimental":false
            },
            {
              "name":"windows-x86_64","runner":"ubuntu-24.04",
              "targets":"x86_64-pc-windows-gnu","cargo_cmd":"cargo",
              "preset":"Windows Desktop x64","out":"build/windows/game.exe",
              "artifact":"game-windows-x86_64","experimental":false
            },
            {
              "name":"android-apk","runner":"ubuntu-24.04",
              "targets":"aarch64-linux-android armv7-linux-androideabi","cargo_cmd":"cargo",
              "preset":"Android arm64","out":"build/android/game.apk",
              "export_format":0,"artifact":"game-android-apk","experimental":false
            },
            {
              "name":"android-aab","runner":"ubuntu-24.04",
              "targets":"aarch64-linux-android armv7-linux-androideabi","cargo_cmd":"cargo",
              "preset":"Android arm64","out":"build/android/game.aab",
              "export_format":1,"artifact":"game-android-aab","experimental":false
            }
          ]'

          if [ -z "${PLATFORMS:-}" ]; then
            echo "未指定 platforms，使用全部平台"
            echo "matrix=$ALL" >> "$GITHUB_OUTPUT"
          else
            echo "过滤 platforms: $PLATFORMS"
            FILTERED="$(jq -c --arg list "$PLATFORMS" '
              ($list | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length>0))) as $names
              | map(select(.name as $n | $names | index($n)))
            ' <<< "$ALL")"
            echo "过滤结果: $FILTERED"
            if [ "$FILTERED" = "[]" ]; then
              echo "::error::platforms 里没有匹配到任何平台：$PLATFORMS"
              exit 1
            fi
            echo "matrix=$FILTERED" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build：每个平台构建 GDExtension + Godot 导出。
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          # tag push → github.ref；手动触发 → inputs.tag（可留空回退到 github.ref）
          ref: ${{ inputs.tag || github.ref }}

      # Godot 编辑器在导入包含 Android preset 的项目时，Android 插件会探测 adb。
      # 提前装好并启动 server，避免导入/导出阶段报错。
      # 注：Android 矩阵项后面还会通过 setup-android 安装 platform-tools（含 adb），
      #     两者路径不同、互不冲突。
      - name: Setup ADB
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y adb
          adb start-server
          adb version
          adb devices

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          rustflags: ""

      - name: Add Rust targets
        run: rustup target add ${{ matrix.targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install MinGW (windows-gnu)
        if: contains(matrix.targets, 'windows-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install cross (linux-arm64)
        if: matrix.cargo_cmd == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Setup Android NDK
        if: contains(matrix.targets, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Install cargo-ndk
        if: contains(matrix.targets, 'android')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build host GDExtension (Linux x86_64, debug) for editor import
        # Godot 编辑器导入场景时会实例化原生类 BevyAppManager，
        # 因此导出前必须提供宿主平台（linux.debug.x86_64）的动态库。
        run: bash ./build.sh

      - name: Build GDExtension library (release, target platform)
        shell: bash
        run: |
          set -euo pipefail
          for t in ${{ matrix.targets }}; do
            abi=""
            case "$t" in
              aarch64-linux-android)   abi="arm64-v8a" ;;
              armv7-linux-androideabi) abi="armeabi-v7a" ;;
            esac
            CARGO_CMD="${{ matrix.cargo_cmd }}" NDK_ABI="$abi" bash ./build.sh --release --target "$t"
          done

      - name: Setup Java (Android export)
        if: contains(matrix.targets, 'android')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (Android export)
        if: contains(matrix.targets, 'android')
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-35
            build-tools;35.0.1
            cmake;3.10.2.4988404
            ndk;28.1.13356709

      - name: Verify Android SDK components
        if: contains(matrix.targets, 'android')
        run: |
          set -euo pipefail
          for d in "platforms/android-35" "build-tools/35.0.1" "ndk/28.1.13356709"; do
            test -d "$ANDROID_HOME/$d" || { echo "缺少 Android SDK 组件: $ANDROID_HOME/$d"; exit 1; }
          done
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Create Android debug keystore
        if: contains(matrix.targets, 'android')
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair \
              -alias androiddebugkey -keypass android \
              -keystore "$HOME/.android/debug.keystore" -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 9999 -deststoretype pkcs12
          fi

      # 有 secret → 用 release keystore；没有 → 静默降级（走 debug 签名），
      # 让手动干跑 / fork 场景也能通过。
      - name: Decode Android release keystore
        if: contains(matrix.targets, 'android')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::notice::ANDROID_KEYSTORE_BASE64 未设置，跳过 release keystore（将使用 debug 签名）"
            exit 0
          fi
          mkdir -p .android-keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > .android-keystore/release.keystore
          test -s .android-keystore/release.keystore

      - name: Configure Android release signing
        if: contains(matrix.targets, 'android')
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.android-keystore/release.keystore
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ ! -f "$ANDROID_KEYSTORE_PATH" ]; then
            echo "::notice::未找到 release keystore，跳过签名配置（将使用 debug 签名）"
            exit 0
          fi
          python3 .github/scripts/configure_android_keystore.py

      # 按矩阵项设置导出格式（APK/AAB，需与输出后缀一致，否则会报
      # "Android App Bundle requires the *.aab extension"），并同时启用
      # arm64-v8a + armeabi-v7a（与上面编译的两个 Rust 目标一致）。
      # 在签名配置之后执行，只改这三个键，不影响脚本写入的签名信息。
      - name: Patch Android export preset
        if: contains(matrix.targets, 'android')
        shell: bash
        run: |
          set -euo pipefail
          CFG="godot-project/export_presets.cfg"
          test -f "$CFG"
          for kv in \
            "gradle_build/export_format=${{ matrix.export_format }}" \
            "architectures/armeabi-v7a=true" \
            "architectures/arm64-v8a=true"; do
            key="${kv%%=*}"
            if grep -q "^${key}=" "$CFG"; then
              sed -i "s|^${key}=.*|${kv}|" "$CFG"
            else
              echo "::error::export_presets.cfg 中找不到 ${key}，请确认 Android 预设已保存过一次"
              exit 1
            fi
          done
          grep -nE "^(name=|gradle_build/(use_gradle_build|export_format)=|architectures/)" "$CFG"

      # ===== 与 ci.yml 完全一致的导入步骤（宽松 + 忽略退出码） =====
      - name: Import project
        timeout-minutes: 10
        run: |
          set +e
          timeout 480 godot --headless --path godot-project --verbose --import
          echo "import exit=$? (ignored)"
          exit 0

      # ===== 与 ci.yml 一致的导出步骤（改为 --export-release + release 校验） =====
      - name: Export release build (${{ matrix.name }})
        timeout-minutes: 30
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
          # 关闭 Gradle daemon（CI 中不需要），并降低日志级别，减少日志体积。
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.logging.level=lifecycle"
        run: |
          set +e
          OUT="$PWD/${{ matrix.out }}"
          mkdir -p "$(dirname "$OUT")"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          # --install-android-build-template 不能单独运行，必须与
          # --export-debug / --export-release 同一条命令使用。
          EXTRA_ARGS=()
          if [[ "${{ matrix.name }}" == android* ]]; then
            EXTRA_ARGS+=(--install-android-build-template)
          fi
          godot --headless --path godot-project --verbose "${EXTRA_ARGS[@]}" \
            --export-release '${{ matrix.preset }}' "$OUT" 2>&1 | tee /tmp/export.log
          echo "godot exit=${PIPESTATUS[0]} (ignored: import/exit may abort)"
          ls -la "$(dirname "$OUT")"
          if [ ! -s "$OUT" ]; then
            echo "::error::export produced no binary"
            tail -n 80 /tmp/export.log
            exit 1
          fi

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release：打包所有 artifact 并创建 / 更新 GitHub Release。
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [prepare, build]
    # 发布条件：
    #   - tag push（v*）→ 始终发布；
    #   - workflow_dispatch → 需要 tag 非空 且 publish=true；
    #   - 任一平台 failure 时不发布（当前 5 个平台都是 experimental: false；以后新增实验平台标 true 可不阻断）。
    if: >-
      !cancelled()
      && needs.build.result != 'failure'
      && (
           github.event_name == 'push'
           || (inputs.tag != '' && inputs.publish)
         )
    steps:
      - name: Download all builds
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          cd dist
          zips=()
          for d in */; do
            [ -d "$d" ] || continue
            name="${d%/}"
            zip -r "${name}.zip" "$d"
            zips+=("${name}.zip")
          done
          if [ ${#zips[@]} -eq 0 ]; then
            echo "❌ 没有任何构建产物，无法发布"
            exit 1
          fi
          ls -l

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/*.zip