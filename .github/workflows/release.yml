name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（例如 v0.1.0）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95"
  # 必须与 godot-project/project.godot 的 config/features 一致。
  GODOT_VERSION: "4.7.2"

# =============================================================================
# 扩展指南：在 build.matrix.include 里追加一条即可（preset 名与
# godot-project/export_presets.cfg 保持一致）。
# =============================================================================

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            targets: x86_64-unknown-linux-gnu
            cargo_cmd: cargo
            preset: Linux x86_64
            out: build/linux/game.x86_64
            artifact: game-linux-x86_64
            experimental: false
          - name: linux-arm64
            runner: ubuntu-24.04
            targets: aarch64-unknown-linux-gnu
            cargo_cmd: cross
            preset: Linux arm64
            out: build/linux/game.arm64
            artifact: game-linux-arm64
            experimental: false
          - name: windows-x86_64
            runner: ubuntu-24.04
            targets: x86_64-pc-windows-gnu
            cargo_cmd: cargo
            preset: Windows Desktop x64
            out: build/windows/game.exe
            artifact: game-windows-x86_64
            experimental: false
          - name: android-arm64
            runner: ubuntu-24.04
            targets: aarch64-linux-android armv7-linux-androideabi
            cargo_cmd: cargo
            preset: Android arm64
            out: build/android/game.apk
            artifact: game-android
            experimental: true

    steps:
      - uses: actions/checkout@v4

      # Godot 编辑器在导入包含 Android preset 的项目时，Android 插件会探测 adb。
      # 提前装好并启动 server，避免导入/导出阶段报错。
      # 注：Android 矩阵项后面还会通过 setup-android 安装 platform-tools（含 adb），
      #     两者路径不同、互不冲突。
      - name: Setup ADB
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y adb
          adb start-server
          adb version
          adb devices

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      # Android Gradle 构建模板仍需单独安装
      - name: Install Android build template
        if: startsWith(matrix.name, 'android')
        run: ggodot --headless --path godot-project --install-android-build-template

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          rustflags: ""

      - name: Add Rust targets
        run: rustup target add ${{ matrix.targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install MinGW (windows-gnu)
        if: contains(matrix.targets, 'windows-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install cross (linux-arm64)
        if: matrix.cargo_cmd == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Setup Android NDK
        if: contains(matrix.targets, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Install cargo-ndk
        if: contains(matrix.targets, 'android')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build host GDExtension (Linux x86_64, debug) for editor import
        # Godot 编辑器导入场景时会实例化原生类 BevyAppManager，
        # 因此导出前必须提供宿主平台（linux.debug.x86_64）的动态库。
        run: bash ./build.sh

      - name: Build GDExtension library (release, target platform)
        shell: bash
        run: |
          set -euo pipefail
          for t in ${{ matrix.targets }}; do
            abi=""
            case "$t" in
              aarch64-linux-android)   abi="arm64-v8a" ;;
              armv7-linux-androideabi) abi="armeabi-v7a" ;;
            esac
            CARGO_CMD="${{ matrix.cargo_cmd }}" NDK_ABI="$abi" bash ./build.sh --release --target "$t"
          done

      - name: Setup Java (Android export)
        if: contains(matrix.targets, 'android')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK (Android export)
        if: contains(matrix.targets, 'android')
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.1.0
            ndk;29.0.14206865

      - name: Verify Android SDK components
        if: contains(matrix.targets, 'android')
        run: |
          set -euo pipefail
          for d in "platforms/android-36" "build-tools/36.1.0" "ndk/29.0.14206865"; do
            test -d "$ANDROID_HOME/$d" || { echo "缺少 Android SDK 组件: $ANDROID_HOME/$d"; exit 1; }
          done
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Create Android debug keystore
        if: contains(matrix.targets, 'android')
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair \
              -alias androiddebugkey -keypass android \
              -keystore "$HOME/.android/debug.keystore" -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 9999 -deststoretype pkcs12
          fi

      - name: Decode Android release keystore
        if: contains(matrix.targets, 'android')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .android-keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > .android-keystore/release.keystore
          test -s .android-keystore/release.keystore

      - name: Configure Android release signing
        if: contains(matrix.targets, 'android')
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/.android-keystore/release.keystore
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 .github/scripts/configure_android_keystore.py

      - name: Install Android build template (gradle build)
        if: contains(matrix.targets, 'android')
        run: |
          set -euo pipefail
          godot --headless --path godot-project --import
          godot --headless --path godot-project --install-android-build-template

      - name: Import project & export release build
        run: |
          set -euo pipefail
          mkdir -p "$(dirname '${{ matrix.out }}')"
          godot --headless --path godot-project --import
          godot --headless --path godot-project --export-release '${{ matrix.preset }}' '${{ matrix.out }}'

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    if: always()
    steps:
      - name: Download all builds
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          cd dist
          zips=()
          for d in */; do
            [ -d "$d" ] || continue
            name="${d%/}"
            zip -r "${name}.zip" "$d"
            zips+=("${name}.zip")
          done
          if [ ${#zips[@]} -eq 0 ]; then
            echo "❌ 没有任何构建产物，无法发布"
            exit 1
          fi
          ls -l

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/*.zip