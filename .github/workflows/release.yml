name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（例如 v0.1.0）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95"
  # godot-ci 镜像的 tag 必须与 project.godot 的 Godot 版本一致。
  GODOT_CI_IMAGE: barichello/godot-ci:4.7.2

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            targets: x86_64-unknown-linux-gnu
            cargo_cmd: cargo
            preset: Linux x86_64
            out: build/linux/game.x86_64
            artifact: game-linux-x86_64
            experimental: false
          - name: linux-arm64
            targets: aarch64-unknown-linux-gnu
            cargo_cmd: cross
            preset: Linux arm64
            out: build/linux/game.arm64
            artifact: game-linux-arm64
            experimental: false
          - name: windows-x86_64
            targets: x86_64-pc-windows-gnu
            cargo_cmd: cargo
            preset: Windows Desktop x64
            out: build/windows/game.exe
            artifact: game-windows-x86_64
            experimental: false
          - name: android-arm64
            targets: aarch64-linux-android armv7-linux-androideabi
            cargo_cmd: cargo
            preset: Android arm64
            out: build/android/game.apk
            artifact: game-android
            experimental: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Add Rust targets
        run: rustup target add ${{ matrix.targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install MinGW (windows-gnu)
        if: contains(matrix.targets, 'windows-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Install cross (linux-arm64)
        if: matrix.cargo_cmd == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Setup Android NDK
        if: contains(matrix.targets, 'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25b

      - name: Install cargo-ndk
        if: contains(matrix.targets, 'android')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build host GDExtension (Linux x86_64, debug) for editor import
        # Godot 编辑器在导入场景时会实例化原生类 BevyAppManager，
        # 因此导出前必须提供宿主平台（linux.debug.x86_64）的动态库。
        run: bash ./build.sh

      - name: Build GDExtension library (release, target platform)
        shell: bash
        run: |
          set -euo pipefail
          for t in ${{ matrix.targets }}; do
            abi=""
            case "$t" in
              aarch64-linux-android)   abi="arm64-v8a" ;;
              armv7-linux-androideabi) abi="armeabi-v7a" ;;
            esac
            CARGO_CMD="${{ matrix.cargo_cmd }}" NDK_ABI="$abi" bash ./build.sh --release --target "$t"
          done

      - name: Decode Android release keystore
        if: contains(matrix.targets, 'android')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p .android-keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > .android-keystore/release.keystore
          test -s .android-keystore/release.keystore

      - name: Configure Android release signing
        if: contains(matrix.targets, 'android')
        env:
          # 导出在容器里跑，所以这里写容器内路径（$PWD 挂载到 /project）。
          ANDROID_KEYSTORE_PATH: /project/.android-keystore/release.keystore
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 .github/scripts/configure_android_keystore.py

      - name: Install Android build template (gradle build)
        # export_presets.cfg 里 gradle_build/use_gradle_build=true，
        # 而 godot-project/android/ 被 gitignore，干净检出时不存在，必须现场安装模板。
        if: contains(matrix.targets, 'android')
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            "$GODOT_CI_IMAGE" \
            bash -lc "godot --headless --path godot-project --import && godot --headless --path godot-project --install-android-build-template"

      - name: Import project & export release build
        run: |
          set -euo pipefail
          mkdir -p "$(dirname '${{ matrix.out }}')"
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            "$GODOT_CI_IMAGE" \
            bash -lc "godot --headless --path godot-project --import && godot --headless --path godot-project --export-release '${{ matrix.preset }}' '${{ matrix.out }}'"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    # 即使 experimental 平台失败（产物缺失）也照常发布其它平台。
    if: always()
    steps:
      - name: Download all builds
        # 允许某个 experimental 平台缺失产物而不中断发布。
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          cd dist
          zips=()
          for d in */; do
            [ -d "$d" ] || continue
            name="${d%/}"
            zip -r "${name}.zip" "$d"
            zips+=("${name}.zip")
          done
          if [ ${#zips[@]} -eq 0 ]; then
            echo "❌ 没有任何构建产物，无法发布"
            exit 1
          fi
          ls -l

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/*.zip
