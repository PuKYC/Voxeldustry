name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95"
  # 必须与 godot-project/project.godot 的 config/features 一致。
  GODOT_VERSION: "4.7.2"
  # Android NDK 版本（r26d 与 Godot 4.7 官方推荐一致）。
  ANDROID_NDK_VERSION: "r26d"

# =============================================================================
# 扩展指南：
#   1) 加新平台 → gdext.matrix.include 追加一条（name 唯一）；
#   2) 加新 Godot 导出 → godot.matrix.include 追加一条，preset 必须与
#      godot-project/export_presets.cfg 中的 name 一致；
#   3) 两个矩阵的 name 建议保持一致，方便对照与排查。
# =============================================================================

jobs:
  # ---------------------------------------------------------------------------
  # Lint：只跑一次（rustfmt / clippy 与平台无关），非阻塞。
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          # v1 默认 RUSTFLAGS=-D warnings；本仓库尚未清完 warning，故清空。
          rustflags: ""

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Lint (non-blocking)
        continue-on-error: true
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Test：平台矩阵，多 OS 并行跑单元测试。
  # ---------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: windows-x86_64
            os: windows-2022
          - name: macos-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          rustflags: ""

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # GDExtension：平台矩阵，每个平台并行构建 native 库。
  # artifact 命名统一为 gdext-debug-<name>，godot job 用 pattern 一次性拉取。
  # ---------------------------------------------------------------------------
  gdext:
    name: GDExtension debug (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            cargo_cmd: cargo
          - name: linux-arm64
            runner: ubuntu-22.04
            targets: aarch64-unknown-linux-gnu
            cargo_cmd: cross
          - name: android-arm64
            runner: ubuntu-24.04
            targets: aarch64-linux-android
            cargo_cmd: cargo-ndk
            ndk_abi: arm64-v8a
          # -------- 追加平台的模板（按需取消注释/复制） --------
          # - name: windows-x86_64
          #   runner: ubuntu-24.04
          #   targets: x86_64-pc-windows-gnu
          #   cargo_cmd: cargo
          # - name: macos-arm64
          #   runner: macos-14
          #   targets: aarch64-apple-darwin
          #   cargo_cmd: cargo
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          rustflags: ""

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Add Rust targets
        if: matrix.targets != ''
        run: rustup target add ${{ matrix.targets }}

      - name: Install cross
        if: matrix.cargo_cmd == 'cross'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install cargo-ndk
        if: matrix.cargo_cmd == 'cargo-ndk'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # 显式安装 JDK 17（Android Gradle 工具链要求 17+）。
      - name: Setup Java 17
        if: matrix.cargo_cmd == 'cargo-ndk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android NDK
        if: matrix.cargo_cmd == 'cargo-ndk'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: false

      - name: Install MinGW (windows-gnu)
        if: contains(matrix.targets, 'windows-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build GDExtension library (debug)
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail
          for t in ${{ matrix.targets }}; do
            case "${{ matrix.cargo_cmd }}" in
              cargo-ndk)
                # 输出到 bin/debug/android/<abi>/，与 *.gdextension 的
                # android.debug.arm64 路径保持一致。
                cargo ndk \
                  --target "$t" \
                  --platform 21 \
                  --output-dir godot-project/bin/debug/android \
                  build
                ;;
              *)
                CARGO_CMD="${{ matrix.cargo_cmd }}" bash ./build.sh --target "$t"
                ;;
            esac
          done

      - name: Upload GDExtension library
        uses: actions/upload-artifact@v4
        with:
          name: gdext-debug-${{ matrix.name }}
          path: godot-project/bin/debug/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Godot：先合并所有平台的 GDExtension 二进制到同一目录，再逐 preset 导出。
  # Android 导出开启了 Gradle 构建（gradle_build/use_gradle_build=true），
  # 因此必须安装 JDK 17，并让 Godot 在编辑器设置里知道 Java / Android SDK 路径。
  # ---------------------------------------------------------------------------
  godot:
    name: Godot debug export (${{ matrix.name }})
    runs-on: ubuntu-22.04
    needs: gdext
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            preset: Linux x86_64
            out: build/linux/game.x86_64
            artifact: godot-debug-linux-x86_64
          - name: linux-arm64
            preset: Linux arm64
            out: build/linux/game.arm64
            artifact: godot-debug-linux-arm64
          - name: android-arm64
            preset: Android arm64
            out: build/android/game.apk
            artifact: godot-debug-android-arm64
          # -------- 追加导出的模板（preset 名必须与 export_presets.cfg 一致） --------
          # - name: windows-x86_64
          #   preset: Windows Desktop x64
          #   out: build/windows/game.exe
          #   artifact: godot-debug-windows-x86_64
    steps:
      - uses: actions/checkout@v4

      # Godot 编辑器在导入包含 Android preset 的项目时，Android 插件会探测 adb，
      # 因此提前装好 adb 并启动 server，避免导入阶段报错/卡住。
      - name: Setup ADB
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y adb
          adb start-server
          adb version
          adb devices

      # Android 导出依赖 JDK 17+（Gradle / keytool / apksigner）。
      # actions/setup-java 会自动设置 JAVA_HOME 环境变量。
      - name: Setup Java 17
        if: startsWith(matrix.name, 'android')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: startsWith(matrix.name, 'android')
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Android debug keystore
        if: startsWith(matrix.name, 'android')
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 9999 -deststoretype pkcs12
          fi

      # 合并所有 gdext-debug-* artifact 到 godot-project/bin/debug
      # （Android 的子目录 bin/debug/android/arm64-v8a/ 会一并保留）
      - name: Download & merge all GDExtension libraries
        uses: actions/download-artifact@v4
        with:
          pattern: gdext-debug-*
          merge-multiple: true
          path: godot-project/bin/debug

      - name: List GDExtension binaries
        run: find godot-project/bin -type f | sort

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      # Android Gradle 构建模板仍需单独安装
      - name: Install Android build template
        if: startsWith(matrix.name, 'android')
        run: godot --headless --path godot-project --install-android-build-template


      # -----------------------------------------------------------------------
      # 关键修正：不再调用 `godot --set_editor_setting`（该参数不存在，
      # 会导致 Godot 以编辑器模式启动并永久挂起），改为直接写编辑器设置文件。
      # 注意：Godot 4.x 的配置文件命名带版本号，这里按 GODOT_VERSION 的前两位
      # 推导（4.7.2 → editor_settings-4.7.tres）。如果换 Godot 版本需同步。
      # -----------------------------------------------------------------------
      - name: Configure Godot Android paths (Gradle build)
        if: startsWith(matrix.name, 'android')
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          set -euo pipefail
          GODOT_VER_MAJOR_MINOR="$(echo "$GODOT_VERSION" | cut -d. -f1-2)"
          SETTINGS_DIR="$HOME/.config/godot"
          SETTINGS_FILE="$SETTINGS_DIR/editor_settings-${GODOT_VER_MAJOR_MINOR}.tres"

          mkdir -p "$SETTINGS_DIR"

          # 如果文件不存在，写一个最小可用的 tres 头部；
          # 如果已存在（例如 Godot 之前运行过），保持原有内容。
          if [ ! -f "$SETTINGS_FILE" ]; then
            cat > "$SETTINGS_FILE" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          EOF
          fi

          # 以幂等方式写入 / 覆盖两个路径键。
          # 若键已存在则替换整行；否则追加到文件末尾。
          set_kv() {
            local key="$1"
            local value="$2"
            if grep -q "^${key}=" "$SETTINGS_FILE"; then
              # 使用 | 作为分隔符，避免路径里的 / 引发 sed 报错。
              sed -i "s|^${key}=.*|${key}=\"${value}\"|" "$SETTINGS_FILE"
            else
              echo "${key}=\"${value}\"" >> "$SETTINGS_FILE"
            fi
          }

          set_kv "export/android/java_sdk_path" "$JAVA_HOME"
          set_kv "export/android/android_sdk_path" "$ANDROID_SDK_ROOT"

          echo "--- editor_settings after configuration ---"
          cat "$SETTINGS_FILE"

      - name: Import project
        timeout-minutes: 10
        run: |
          set +e
          timeout 480 godot --headless --path godot-project --verbose --import
          echo "import exit=$? (ignored)"
          exit 0

      - name: Export debug build (${{ matrix.name }})
        timeout-minutes: 30
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
          # 关闭 Gradle daemon（CI 中不需要），并降低日志级别，减少日志体积。
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.logging.level=lifecycle"
        run: |
          set +e
          OUT="$PWD/${{ matrix.out }}"
          mkdir -p "$(dirname "$OUT")"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          godot --headless --path godot-project --verbose \
            --export-debug '${{ matrix.preset }}' "$OUT" 2>&1 | tee /tmp/export.log
          echo "godot exit=${PIPESTATUS[0]} (ignored: import/exit may abort)"
          ls -la "$(dirname "$OUT")"
          if [ ! -s "$OUT" ]; then
            echo "::error::export produced no binary"
            tail -n 80 /tmp/export.log
            exit 1
          fi

      - name: Upload Godot debug build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/
          if-no-files-found: errors