name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95"
  # godot-ci 镜像的 tag 必须与 project.godot 的 Godot 版本一致。
  GODOT_CI_IMAGE: barichello/godot-ci:4.7.2

jobs:
  rust:
    name: Rust build (debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          # v1 默认 RUSTFLAGS=-D warnings；本仓库尚未清完 warning，故清空。
          rustflags: ""

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Lint (non-blocking)
        continue-on-error: true
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build GDExtension library (debug)
        run: bash ./build.sh

      - name: Upload GDExtension library
        uses: actions/upload-artifact@v4
        with:
          name: gdext-debug-linux-x86_64
          path: godot-project/bin/debug/
          if-no-files-found: error

  godot:
    name: Godot build (debug export)
    runs-on: ubuntu-24.04
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Download GDExtension library
        uses: actions/download-artifact@v4
        with:
          name: gdext-debug-linux-x86_64
          path: godot-project/bin/debug

      - name: Import project & export debug build
        run: |
          set -uo pipefail
          mkdir -p build/linux
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            "$GODOT_CI_IMAGE" \
            bash -lc "godot --headless --verbose --path godot-project --import && godot --headless --verbose --path godot-project --export-debug 'Linux x86_64' 'build/linux/game.x86_64'" \
            > /tmp/godot-export.log 2>&1
          code=$?
          echo "docker exit code: $code"
          tail -n 80 /tmp/godot-export.log || true
          if [ "$code" -ne 0 ]; then
            echo "::error::godot export failed with exit code $code"
            n=0
            while IFS= read -r line && [ "$n" -lt 25 ]; do
              echo "::error::${line//'%'/'%25'}"
              n=$((n+1))
            done < <(tail -n 25 /tmp/godot-export.log)
            exit "$code"
          fi

      - name: Upload Godot debug build
        uses: actions/upload-artifact@v4
        with:
          name: godot-debug-linux-x86_64
          path: build/
          if-no-files-found: error
