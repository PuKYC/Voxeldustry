name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95"
  # 必须与 godot-project/project.godot 的 config/features 一致。
  GODOT_VERSION: "4.7.2"

jobs:
  rust:
    name: Rust build (debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          # v1 默认 RUSTFLAGS=-D warnings；本仓库尚未清完 warning，故清空。
          rustflags: ""

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Lint (non-blocking)
        continue-on-error: true
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build GDExtension library (debug)
        run: bash ./build.sh

      - name: Upload GDExtension library
        uses: actions/upload-artifact@v4
        with:
          name: gdext-debug-linux-x86_64
          path: godot-project/bin/debug/
          if-no-files-found: error

  godot:
    name: Godot build (debug export)
    runs-on: ubuntu-24.04
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - name: Download GDExtension library
        uses: actions/download-artifact@v4
        with:
          name: gdext-debug-linux-x86_64
          path: godot-project/bin/debug

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --path godot-project --import

      - name: Export debug build (Linux x86_64)
        run: |
          # 临时诊断：把导出日志写入注解，便于在无 token 的情况下读取。
          set +e
          mkdir -p build/linux
          godot --headless --path godot-project --export-debug "Linux x86_64" build/linux/game.x86_64 > /tmp/export.log 2>&1
          code=$?
          {
            echo "export exit=$code"
            echo "=== export_templates ==="
            ls -1 "$HOME/.local/share/godot/export_templates" 2>&1
            ls -1 "$HOME/.local/share/godot/export_templates/4.7.2.stable" 2>&1 | head -n 40
            echo "=== build/linux ==="
            ls -la build/linux 2>&1 || true
            echo "=== export log (tail 200) ==="
            tail -n 200 /tmp/export.log
          } > /tmp/diag.txt 2>&1
          cat /tmp/diag.txt
          payload=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' /tmp/diag.txt)
          echo "::error title=godot-export-diag::$payload"
          exit "$code"

      - name: Upload Godot debug build
        uses: actions/upload-artifact@v4
        with:
          name: godot-debug-linux-x86_64
          path: build/
          if-no-files-found: error
